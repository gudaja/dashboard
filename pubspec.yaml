name: flutter_dashboard_grid
description: >-
  Dashboard grid your users lay out themselves: resize, move, column sections,
  a phone and tablet section carousel and edit-mode handles. A fork of the
  dashboard package.
version: 1.1.0
homepage: https://github.com/gudaja/dashboard
repository: https://github.com/gudaja/dashboard
issue_tracker: https://github.com/gudaja/dashboard/issues
topics:
  - dashboard
  - grid
  - layout
  - drag-and-drop
  - widget
screenshots:
  - description: Moving an item across column sections in edit mode.
    path: documentation/virtual_columns.gif

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Widened from ^6.0.0: flutter_lints 6.x requires Dart ^3.8.0, while the
  # consuming project is pinned to Flutter 3.27.4 (Dart 3.6.2), which made this
  # package's own test suite unresolvable. The range still picks 6.x on newer
  # SDKs. Dev-only dependency: consumers never resolve it.
  flutter_lints: ">=5.0.0 <7.0.0"

