name: dashboard
description: Dynamic dashboard widget that allows your users to create their own layouts. Resize, move, indirect resize/move, auto
  re-layout are supported.
version: 0.0.5
homepage: https://github.com/Mehmetyaz/dashboard
repository: https://github.com/Mehmetyaz/dashboard

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Widened from ^6.0.0: flutter_lints 6.x requires Dart ^3.8.0, while the
  # consuming project is pinned to Flutter 3.27.4 (Dart 3.6.2), which made this
  # package's own test suite unresolvable. The range still picks 6.x on newer
  # SDKs. Dev-only dependency: consumers never resolve it.
  flutter_lints: ">=5.0.0 <7.0.0"

